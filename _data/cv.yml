- title: Research Experience
  type: time_table
  contents:
    - title: Generative Modelling Using Zero-Shot Learning and Transfer Learning (ongoing project)
      institution: Department of Statistical Sciences, University of Toronto
      year: 2023 - Present
      description:
        - Currently designing novel numerical techniques that perform transfer learning among multiple batches of data (possibly embedded in different manifolds).
        - Making connections between transfer learning and classical statistical models (e.g., regression, classification).
        - title: Supervisors
          contents:
            - <a href="https://www.statistics.utoronto.ca/people/directories/all-faculty/dehan-kong">Dr. Dehan Kong (University of Toronto)</a>
            - <a href="http://sites.utoronto.ca/zhanglab/">Dr. Zhaolei Zhang (University of Toronto)</a>     
    - title: Trajectory Inference Using Stochastic Differential Equations and Mean Field Control
      institution: Department of Statistical Sciences, University of Toronto
      year: 2021 - 2023
      description:
        - Manuscript submitted, <a href="https://www.biorxiv.org/content/10.1101/2023.08.10.552373v1">Preprint available</a>.
        - Proposed a comprehensive mathematical model integrating concepts from mean field control and SDE to capture crowd motion in a population observed over a timeline.
        - Constructed a neural network using PyTorch to parametrize the SDE model.
        - Implemented an innovative numerical algorithm more suitable for models with higher complexity as compared to other existing SDE solvers.
        - Analyzed multiple different data sets and demonstrated excellent customizability and performance from the model.
        - title: Supervisors
          contents:
            - <a href="https://www.statistics.utoronto.ca/people/directories/all-faculty/dehan-kong">Dr. Dehan Kong (University of Toronto)</a>
            - <a href="http://sites.utoronto.ca/zhanglab/">Dr. Zhaolei Zhang (University of Toronto)</a>
    - title: Modelling Single-Cell Developmental Trajectory Using Optimal Transport
      institution: Department of Statistical Sciences, University of Toronto
      year: 2020 - 2023
      description:
        - Manuscript in preparation.
        - Proposed a novel test statistic for change point detection in time series data and constructed an innovative mathematical model for population movement.
        - Developed an integrative framework written in Python, R and MATLAB for numerical optimization and performance evaluation.
        - The proposed testing method outperformed other state-of-the-art methods in change point detection.
        - Analyzed high-dimensional (over 20,000 dimensions) time series data from over 250,000 cells.
        - title: Supervisors
          contents:
            - <a href="https://www.statistics.utoronto.ca/people/directories/all-faculty/dehan-kong">Dr. Dehan Kong (University of Toronto)</a>
            - <a href="http://sites.utoronto.ca/zhanglab/">Dr. Zhaolei Zhang (University of Toronto)</a>
    - title: Mount Sinai Hospital - Kandel Lab (Project Student)
      institution: Laboratory Medicine and Pathobiology, University of Toronto
      year: 2017 - 2018
      description:
        - Analyzed effects of Tgfb3 on the regeneration of nucleus pulposus tissue (cell/tissue culture and extracellular matrix quantification).
        - title: Supervisors
          contents:
            - <a href="https://lmp.utoronto.ca/faculty/rita-kandel">Dr. Rita Kandel (Mount Sinai Hospital)</a>
    - title: MaRS Discovery District - Mekhail Lab (Summer Student)
      institution: Laboratory Medicine and Pathobiology, University of Toronto
      year: 2017
      description:
        - Analyzed effects of Poly-Q expansion on yeast replicative lifespan(RNA variants and cell culture).
        - <a href="https://pubmed.ncbi.nlm.nih.gov/30417124/">Pubished paper</a>.
        - title: Supervisors
          contents:
            - <a href="https://lmp.utoronto.ca/faculty/karim-mekhail">Dr. Karim Mekhail (University of Toronto)</a>

