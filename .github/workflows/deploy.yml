name: Deploy site

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Compile the LaTeX resume so the published site always serves the PDF
      # built from the current sources in resume/.
      - name: Build resume PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume_special.tex
          working_directory: resume
          args: -pdf -outdir=build -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Publish resume PDF into site assets
        run: |
          set -euxo pipefail
          if [ ! -f resume/build/resume_special.pdf ]; then
            echo "::error::resume/build/resume_special.pdf was not produced"
            ls -laR resume | head -60
            exit 1
          fi
          mkdir -p assets/pdf
          cp resume/build/resume_special.pdf assets/pdf/resume_KZhang.pdf
          # latex-action runs in a container as root, so resume/build and its
          # contents are root-owned and need sudo to clear from the host runner.
          sudo rm -rf resume/build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          clean: false
